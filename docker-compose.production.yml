# =============================================================================
# PRESENCE System - Production Docker Compose
# =============================================================================
# Usage: docker-compose -f docker-compose.production.yml up -d
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: presence-postgres
    restart: unless-stopped
    environment:
      # Fail-closed: do not provide insecure defaults in production.
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presence_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: presence-redis
    restart: unless-stopped
    # Fail-closed: require explicit password.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Mosquitto MQTT Broker (for IoT devices)
  mosquitto:
    image: eclipse-mosquitto:2-alpine
    container_name: presence-mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PRESENCE API Server
  server:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: presence-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      # CORS (required by fail-closed env validation in prod-like mode)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Secrets (required)
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # Required: 32-byte key (base64 recommended) or 64-char hex.
      # Primary: ENCRYPTION_MASTER_KEY (ENCRYPTION_KEY is deprecated alias).
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      # Deprecated (kept for existing deployments):
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - METRICS_ENABLED=true
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - uploads_data:/var/lib/presence/uploads
      - logs_data:/var/log/presence
      - backups_data:/var/backups/presence
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # PRESENCE Client (built separately or using nginx)
  client:
    image: nginx:alpine
    container_name: presence-client
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: presence-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana (visualization)
  grafana:
    image: grafana/grafana:10.0.0
    container_name: presence-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-secure_grafana_password}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Alertmanager (alerts)
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: presence-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - presence-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Exporters (required for Prometheus jobs in monitoring/prometheus.yml)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: presence-node-exporter
    restart: unless-stopped
    networks:
      - presence-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: presence-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - presence-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: presence-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - presence-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
  backups_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  presence-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
