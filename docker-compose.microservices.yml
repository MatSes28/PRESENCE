# Microservices Architecture for CLIRDEC:PRESENCE System
# This configuration prepares the system for microservices deployment

version: "3.8"

services:
  # API Gateway
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
    depends_on:
      - service-registry
    networks:
      - presence-network
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=/etc/nginx/templates
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service Registry (Consul)
  service-registry:
    image: consul:1.15
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: "agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0"
    volumes:
      - consul-data:/consul/data
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Authentication Service
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - SERVICE_NAME=auth-service
      - SERVICE_PORT=3000
      - CONSUL_URL=service-registry:8500
      - DATABASE_URL=postgresql://user:password@database:5432/presence
      - REDIS_URL=redis://redis:6379
    depends_on:
      - database
      - redis
      - service-registry
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Attendance Service
  attendance-service:
    build:
      context: ./services/attendance-service
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - SERVICE_NAME=attendance-service
      - SERVICE_PORT=3000
      - CONSUL_URL=service-registry:8500
      - DATABASE_URL=postgresql://user:password@database:5432/presence
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3000
    depends_on:
      - database
      - redis
      - service-registry
      - auth-service
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Student Management Service
  student-service:
    build:
      context: ./services/student-service
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      - SERVICE_NAME=student-service
      - SERVICE_PORT=3000
      - CONSUL_URL=service-registry:8500
      - DATABASE_URL=postgresql://user:password@database:5432/presence
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3000
    depends_on:
      - database
      - redis
      - service-registry
      - auth-service
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reporting Service
  reporting-service:
    build:
      context: ./services/reporting-service
      dockerfile: Dockerfile
    ports:
      - "3004:3000"
    environment:
      - SERVICE_NAME=reporting-service
      - SERVICE_PORT=3000
      - CONSUL_URL=service-registry:8500
      - DATABASE_URL=postgresql://user:password@database:5432/presence
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3000
    depends_on:
      - database
      - redis
      - service-registry
      - auth-service
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    ports:
      - "3005:3000"
    environment:
      - SERVICE_NAME=notification-service
      - SERVICE_PORT=3000
      - CONSUL_URL=service-registry:8500
      - DATABASE_URL=postgresql://user:password@database:5432/presence
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - database
      - redis
      - service-registry
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IoT Device Management Service
  iot-service:
    build:
      context: ./services/iot-service
      dockerfile: Dockerfile
    ports:
      - "3006:3000"
    environment:
      - SERVICE_NAME=iot-service
      - SERVICE_PORT=3000
      - CONSUL_URL=service-registry:8500
      - DATABASE_URL=postgresql://user:password@database:5432/presence
      - REDIS_URL=redis://redis:6379
      - MQTT_BROKER_URL=mqtt://mqtt:1883
    depends_on:
      - database
      - redis
      - service-registry
      - mqtt
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSocket Service for Real-time Features
  websocket-service:
    build:
      context: ./services/websocket-service
      dockerfile: Dockerfile
    ports:
      - "3007:3000"
    environment:
      - SERVICE_NAME=websocket-service
      - SERVICE_PORT=3000
      - CONSUL_URL=service-registry:8500
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3000
    depends_on:
      - redis
      - service-registry
      - auth-service
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main Web Application
  web-app:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=https://api.presence.clirdec.edu
      - REACT_APP_WS_URL=wss://ws.presence.clirdec.edu
    depends_on:
      - api-gateway
    networks:
      - presence-network

  # Database
  database:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=presence
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database_setup.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./add-columns.sql:/docker-entrypoint-initdb.d/02-columns.sql
    networks:
      - presence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d presence"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MQTT Broker for IoT
  mqtt:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/config:/mosquitto/config:ro
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - presence-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3008:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - presence-network
    depends_on:
      - prometheus

  # Load Balancer (HAProxy)
  load-balancer:
    image: haproxy:2.7-alpine
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - web-app
      - api-gateway
    networks:
      - presence-network
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  consul-data:
  postgres-data:
  redis-data:
  mqtt-data:
  mqtt-logs:
  prometheus-data:
  grafana-data:

networks:
  presence-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
