# HAProxy (scaling) - HTTP-only config for local/compose scaling tests.
#
# This intentionally avoids TLS termination and the built-in stats interface
# to prevent committing default credentials into production-like configs.

global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    timeout http-request 10000

frontend http_front
    bind *:8080
    mode http

    acl is_api path_beg /api/
    acl is_health path /health
    acl is_ws path_beg /ws/

    use_backend health_backend if is_health
    use_backend websocket_backend if is_ws
    use_backend api_backend if is_api
    default_backend web_backend

backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 10s fall 3 rise 2

    server app-1 presence-app-1:3000 check
    server app-2 presence-app-2:3000 check
    server app-3 presence-app-3:3000 check backup

backend websocket_backend
    mode http
    balance source
    option httpchk GET /health
    http-check expect status 200
    timeout server 86400s
    timeout tunnel 86400s
    default-server inter 10s fall 3 rise 2

    server app-1 presence-app-1:3000 check
    server app-2 presence-app-2:3000 check
    server app-3 presence-app-3:3000 check backup

backend web_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server inter 10s fall 3 rise 2

    server app-1 presence-app-1:3000 check
    server app-2 presence-app-2:3000 check
    server app-3 presence-app-3:3000 check backup

backend health_backend
    mode http
    http-response set-status 200
    http-response set-header Content-Type "text/plain"
    http-response set-body "OK"

