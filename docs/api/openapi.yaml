  # Schedule Management
  /schedules:
    get:
      summary: Get class schedules
      description: Retrieve class schedules with optional filtering
      tags:
        - Schedules
      security:
        - bearerAuth: []
      parameters:
        - name: facultyId
          in: query
          schema:
            type: integer
          description: Filter by faculty ID
        - name: subjectId
          in: query
          schema:
            type: integer
          description: Filter by subject ID
        - name: dayOfWeek
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 6
          description: Filter by day of week (0-6)
        - name: semester
          in: query
          schema:
            type: string
            enum: ["1st Semester", "2nd Semester", "Summer"]
          description: Filter by semester
        - name: academicYear
          in: query
          schema:
            type: string
            pattern: "^\\d{4}$"
          description: Filter by academic year
      responses:
        "200":
          description: Schedules retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulesResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create class schedule
      description: Create a new class schedule (admin only)
      tags:
        - Schedules
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjectId
                - classroomId
                - facultyId
                - dayOfWeek
                - startTime
                - endTime
                - semester
                - academicYear
              properties:
                subjectId:
                  type: integer
                  example: 1
                classroomId:
                  type: integer
                  example: 1
                facultyId:
                  type: integer
                  example: 1
                dayOfWeek:
                  type: integer
                  minimum: 0
                  maximum: 6
                  example: 1
                startTime:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  example: "08:00"
                endTime:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  example: "09:30"
                semester:
                  type: string
                  enum: ["1st Semester", "2nd Semester", "Summer"]
                  example: "1st Semester"
                academicYear:
                  type: string
                  pattern: "^\\d{4}$"
                  example: "2025"
                isRecurring:
                  type: boolean
                  default: false
                  example: true
                recurrencePattern:
                  type: string
                  enum: [weekly, biweekly, monthly]
                  example: weekly
                recurrenceEndDate:
                  type: string
                  format: date
                  example: "2025-12-31"
                conflictResolutionPriority:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                  example: 5
      responses:
        "201":
          description: Schedule created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Schedule created successfully"
                      schedule:
                        $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Schedule conflict detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /schedules/{id}:
    put:
      summary: Update class schedule
      description: Update an existing class schedule (admin only)
      tags:
        - Schedules
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Schedule ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectId:
                  type: integer
                  example: 1
                classroomId:
                  type: integer
                  example: 1
                facultyId:
                  type: integer
                  example: 1
                dayOfWeek:
                  type: integer
                  minimum: 0
                  maximum: 6
                  example: 1
                startTime:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  example: "08:00"
                endTime:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  example: "09:30"
                semester:
                  type: string
                  enum: ["1st Semester", "2nd Semester", "Summer"]
                  example: "1st Semester"
                academicYear:
                  type: string
                  pattern: "^\\d{4}$"
                  example: "2025"
                isRecurring:
                  type: boolean
                  example: true
                recurrencePattern:
                  type: string
                  enum: [weekly, biweekly, monthly]
                  example: weekly
                recurrenceEndDate:
                  type: string
                  format: date
                  example: "2025-12-31"
                conflictResolutionPriority:
                  type: integer
                  minimum: 1
                  maximum: 10
                  example: 5
      responses:
        "200":
          description: Schedule updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Schedule updated successfully"
                      schedule:
                        $ref: "#/components/schemas/Schedule"
        "400":
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete class schedule
      description: Delete a class schedule (admin only)
      tags:
        - Schedules
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Schedule ID
      responses:
        "200":
          description: Schedule deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      message:
                        type: string
                        example: "Schedule deleted successfully"
        "404":
          description: Schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

