# =============================================================================
# PRESENCE System - Production Nginx Configuration
# =============================================================================
# This configuration is optimized for high-performance production deployment
# with SSL termination, caching, and security headers.

# Run as non-root user
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Worker connections and performance
events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # =============================================================================
    # Core Settings
    # =============================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with response time
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json 
               application/javascript application/xml application/xml+rss 
               text/javascript application/x-javascript image/svg+xml;

    # Buffer sizes
    client_body_buffer_size 16K;
    client_max_body_size 100M;
    proxy_buffer_size 128K;
    proxy_buffers 4 256K;
    proxy_busy_buffers_size 256K;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =============================================================================
    # Upstream Definitions
    # =============================================================================
    upstream presence_api {
        least_conn;
        # Docker Compose: the API service is named `server`
        server server:3000;
        keepalive 32;
    }

    # Client is served as static files from /usr/share/nginx/html (no dev proxy).

    # =============================================================================
    # HTTP Server Block (Docker Compose / static SPA + reverse-proxy API)
    # =============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Static assets
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Block public metrics exposure at the edge.
        location = /api/metrics {
            return 404;
        }

        # API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://presence_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket support
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket
        location /ws {
            limit_conn conn_limit 10;

            proxy_pass http://presence_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Health check (proxy real API health)
        location /health {
            access_log off;
            proxy_pass http://presence_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Disable nginx-level /metrics (Prometheus should scrape the app or node exporter directly)
        location /metrics {
            return 404;
        }
    }

    # =============================================================================
    # HTTPS Server Block
    # =============================================================================
    # TLS termination is intentionally DISABLED by default in this repo config so
    # the nginx container can start without mounted certificate files.
    #
    # Recommended: terminate TLS in your cloud load balancer / reverse proxy.
    # If you want nginx to terminate TLS, add back an HTTPS server block and mount
    # certs into the container.

    # =============================================================================
    # HTTPS Server Block (Alternative - Multiple Domains)
    # =============================================================================
    # Uncomment and modify for multi-domain deployment
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name presence.your-domain.com;
    #
    #     ssl_certificate /etc/letsencrypt/live/presence.your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/presence.your-domain.com/privkey.pem;
    #
    #     # ... same configuration as above
    # }
}
