name: Verify And Deploy Smoke

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.20.2"
  PRODUCTION_HEALTH_URL: "https://presence-production-1c78.up.railway.app/health"

jobs:
  verify:
    name: Verify local parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local verification gate
        run: npm run verify:local

      - name: Build production Docker image
        run: docker build -f Dockerfile -t presence-ci-smoke:${{ github.sha }} .

      - name: Smoke production Docker image
        shell: bash
        run: |
          set -euo pipefail

          image="presence-ci-smoke:${GITHUB_SHA}"
          container="presence-ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          port="3010"
          key="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          secret="ci-smoke-secret-0123456789abcdef0123456789abcdef"

          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container" -p "${port}:3000" \
            -e USE_SQLITE=true \
            -e DATABASE_URL=sqlite:///app/presence.db \
            -e SQLITE_PATH=/app/presence.db \
            -e SESSION_SECRET="$secret" \
            -e JWT_SECRET="$secret" \
            -e JWT_REFRESH_SECRET="$secret" \
            -e ENCRYPTION_MASTER_KEY="$key" \
            -e ALLOWED_ORIGINS="http://127.0.0.1:${port}" \
            -e FRONTEND_URL="http://127.0.0.1:${port}" \
            -e BACKUP_ENABLED=false \
            -e PORT=3000 \
            "$image"

          for attempt in {1..30}; do
            payload="$(curl -fsS "http://127.0.0.1:${port}/health" || true)"

            status="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.status || '')" "$payload" 2>/dev/null || true)"
            database="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.services?.database || '')" "$payload" 2>/dev/null || true)"
            environment="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.deployment?.environment || '')" "$payload" 2>/dev/null || true)"

            echo "attempt=$attempt status=$status database=$database environment=$environment"

            if [[ "$status" == "healthy" && "$database" == "up" && "$environment" == "production" ]]; then
              exit 0
            fi

            if ! docker ps --format '{{.Names}}' | grep -Fxq "$container"; then
              echo "Container exited before becoming healthy."
              docker logs "$container" --tail 200 || true
              exit 1
            fi

            sleep 3
          done

          echo "Production image did not become healthy in time."
          docker logs "$container" --tail 200 || true
          exit 1

  production-smoke:
    name: Production smoke check
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Wait for Railway deployment and verify health
        shell: bash
        run: |
          expected="${GITHUB_SHA::7}"

          for attempt in {1..40}; do
            payload="$(curl -fsS "$PRODUCTION_HEALTH_URL" || true)"

            status="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.status || '')" "$payload" 2>/dev/null || true)"
            commit="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.deployment?.commit || '')" "$payload" 2>/dev/null || true)"
            database="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.services?.database || '')" "$payload" 2>/dev/null || true)"

            echo "attempt=$attempt status=$status commit=$commit database=$database expected=$expected"

            if [[ "$status" == "healthy" && "$database" == "up" && "$commit" == "$expected" ]]; then
              exit 0
            fi

            sleep 15
          done

          echo "Production did not report the expected healthy commit in time."
          exit 1
