name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Quality Assurance Job
  quality-assurance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run check

      - name: Run type checking
        run: |
          cd server && npm run check
          cd ../client && npm run check

      - name: Run unit tests
        run: cd server && npm run test:unit

      - name: Run integration tests
        run: cd server && npm run test:integration

      - name: Run security audit
        run: |
          npm audit --audit-level=moderate
          cd server && npm audit --audit-level=moderate

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            server/coverage/
            server/test-results/

  # Security Testing Job
  security-testing:
    runs-on: ubuntu-latest
    needs: quality-assurance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install
          cd server && npm install

      - name: Run security tests
        run: cd server && npm run test:security

      - name: Run dependency vulnerability scan
        run: |
          npm audit --json | jq '.vulnerabilities' > vulnerabilities.json
          if [ $(jq '.high + .critical' vulnerabilities.json) -gt 0 ]; then
            echo "High or critical vulnerabilities found!"
            exit 1
          fi

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Build and Test Application
  build-and-test:
    runs-on: ubuntu-latest
    needs: [quality-assurance, security-testing]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Setup test database
        run: |
          cd server
          npm run db:push
          npx drizzle-kit generate
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_db

      - name: Build client
        run: npm run build --workspace=client

      - name: Build server
        run: |
          cd server
          npm run build

      - name: Run end-to-end tests
        run: |
          cd server
          npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            server/dist/
            client/dist/

  # Performance Testing
  performance-testing:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: perf_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Artillery
        run: npm install -g artillery

      - name: Setup test database
        run: |
          cd server
          npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/perf_db

      - name: Start application
        run: |
          cd server
          npm run build
          npm start &
          sleep 10
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/perf_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: production

      - name: Run load tests
        run: artillery run server/tests/load/artillery.yml --output load-test-results.json

      - name: Generate performance report
        run: artillery report load-test-results.json

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: load-test-results.json

  # Docker Build and Push
  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-test, performance-testing]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to Railway staging
        run: |
          echo "Deploying to staging environment"
          # Railway deployment would be triggered by push to develop branch
          # This step would typically use Railway CLI or API

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [docker-build, performance-testing]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to Railway production
        run: |
          echo "Deploying to production environment"
          # Railway deployment triggered by push to main branch

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against production"
          # Add smoke tests here

      - name: Notify deployment success
        run: |
          echo "Deployment completed successfully"
          # Add notification logic here (Slack, email, etc.)

  # Rollback Job (manual trigger)
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back to previous version"
          # Add rollback logic here
