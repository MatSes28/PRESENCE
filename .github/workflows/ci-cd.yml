name: Verify And Deploy Smoke

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.20.2"
  PRODUCTION_HEALTH_URL: "https://presence-production-1c78.up.railway.app/health"

jobs:
  verify:
    name: Verify local parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local verification gate
        run: npm run verify:local

  production-smoke:
    name: Production smoke check
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Wait for Railway deployment and verify health
        shell: bash
        run: |
          expected="${GITHUB_SHA::7}"

          for attempt in {1..40}; do
            payload="$(curl -fsS "$PRODUCTION_HEALTH_URL" || true)"

            status="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.status || '')" "$payload" 2>/dev/null || true)"
            commit="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.deployment?.commit || '')" "$payload" 2>/dev/null || true)"
            database="$(node -e "const h=JSON.parse(process.argv[1] || '{}'); console.log(h.services?.database || '')" "$payload" 2>/dev/null || true)"

            echo "attempt=$attempt status=$status commit=$commit database=$database expected=$expected"

            if [[ "$status" == "healthy" && "$database" == "up" && "$commit" == "$expected" ]]; then
              exit 0
            fi

            sleep 15
          done

          echo "Production did not report the expected healthy commit in time."
          exit 1
