name: Manual Load Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.20.2"
  LOAD_TEST_NODE_VERSION: "22.13.0"

jobs:
  load-tests:
    name: Load tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run database migrations
        run: npm run db:push --workspace=server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Start application
        run: |
          npm run start --workspace=server &
          echo $! > server.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3000

      - name: Wait for application
        run: timeout 60 bash -c 'until curl -fsS http://localhost:3000/health; do sleep 2; done'

      - name: Setup Node.js for load tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.LOAD_TEST_NODE_VERSION }}
          cache: npm
          cache-dependency-path: load-tests/package-lock.json

      - name: Install load test dependencies
        working-directory: load-tests
        run: npm ci --workspaces=false
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Run load tests
        working-directory: load-tests
        run: npm run test:load:all
        env:
          LOADTEST_EMAIL: ${{ secrets.LOADTEST_EMAIL }}
          LOADTEST_PASSWORD: ${{ secrets.LOADTEST_PASSWORD }}
          LOADTEST_DEVICE_API_KEY: ${{ secrets.LOADTEST_DEVICE_API_KEY }}
