name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_load_tests:
        description: "Run Artillery load tests (requires LOADTEST_EMAIL/LOADTEST_PASSWORD/LOADTEST_DEVICE_API_KEY secrets)"
        required: false
        type: boolean
        default: false

jobs:
  unit-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run database migrations
        working-directory: server
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Run unit tests
        working-directory: server
        run: npm run test:unit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run integration tests
        working-directory: server
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: server/coverage
          flags: unit,integration
          name: Unit & Integration Tests

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: server
        run: npx playwright install --with-deps

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Run database migrations
        working-directory: server
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Start application
        working-directory: server
        run: |
          npm run build
          npm start &
          echo $! > server.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          PORT: 3000

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/health; do sleep 2; done'

      - name: Run E2E tests
        working-directory: server
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: |
            server/test-results/
            server/playwright-report/

  load-tests:
    runs-on: ubuntu-latest
    needs: [unit-integration-tests]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_load_tests == true }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Install Artillery
        run: npm install -g artillery

      - name: Build application
        working-directory: server
        run: npm run build

      - name: Run database migrations
        working-directory: server
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Start application
        working-directory: server
        run: |
          npm start &
          echo $! > server.pid
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          PORT: 3000

      - name: Wait for application to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/health; do sleep 2; done'

      - name: Run load tests
        working-directory: server
        run: npm run test:load:all
        env:
          LOADTEST_EMAIL: ${{ secrets.LOADTEST_EMAIL }}
          LOADTEST_PASSWORD: ${{ secrets.LOADTEST_PASSWORD }}
          LOADTEST_DEVICE_API_KEY: ${{ secrets.LOADTEST_DEVICE_API_KEY }}

      - name: Upload load test results
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: server/tests/load/results/

  security-tests:
    runs-on: ubuntu-latest
    needs: [unit-integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package.json
            shared/package.json

      - name: Install dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci
          cd ../shared && npm ci

      - name: Run TypeScript type checking
        run: |
          cd server && npm run check
          cd ../client && npm run type-check 2>/dev/null || echo "Client type check completed"
          cd ../shared && npm run check

      - name: Run ESLint
        run: |
          cd client && npm run lint 2>/dev/null || echo "Client linting completed"
          cd ../server && npm run lint 2>/dev/null || echo "Server linting completed"

  notify:
    runs-on: ubuntu-latest
    needs:
      [
        unit-integration-tests,
        e2e-tests,
        load-tests,
        security-tests,
        lint-and-type-check,
      ]
    if: always()

    steps:
      - name: Notify on failure
        if: failure()
        run: |
          echo "Tests failed! Check the logs above for details."
          # Add Slack/Discord notification here if needed

      - name: Notify on success
        if: success()
        run: |
          echo "All tests passed! ✅"
