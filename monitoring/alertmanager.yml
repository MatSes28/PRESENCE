# Alertmanager Configuration for CLIRDEC:PRESENCE System

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "clirdecpresence@gmail.com"
  smtp_auth_username: "clirdecpresence@gmail.com"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default-receiver"
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: "critical-receiver"
      continue: true

    # Warning alerts - during business hours
    - match:
        severity: warning
      receiver: "warning-receiver"
      group_interval: 10m

    # Database alerts
    - match:
        category: database
      receiver: "database-receiver"
      continue: true

    # IoT device alerts
    - match:
        category: iot
      receiver: "iot-receiver"
      continue: true

receivers:
  # Default receiver - email all alerts
  - name: "default-receiver"
    email_configs:
      - to: "admin@clirdec.edu"
        send_resolved: true
        headers:
          Subject: "[PRESENCE Alert] {{ .Status }} - {{ .AlertName }}"

  # Critical alerts - SMS + Email
  - name: "critical-receiver"
    email_configs:
      - to: "admin@clirdec.edu,director@clirdec.edu"
        send_resolved: true
        headers:
          Subject: "[CRITICAL] PRESENCE System Alert"
    webhook_configs:
      - url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        send_resolved: true

  # Warning alerts - Email only during business hours
  - name: "warning-receiver"
    email_configs:
      - to: "admin@clirdec.edu"
        send_resolved: true
        headers:
          Subject: "[WARNING] PRESENCE System Alert"

  # Database alerts - DBA team
  - name: "database-receiver"
    email_configs:
      - to: "dba-team@clirdec.edu"
        send_resolved: true
        headers:
          Subject: "[DB ALERT] PRESENCE Database"

  # IoT alerts - Lab technicians
  - name: "iot-receiver"
    email_configs:
      - to: "lab-tech@clirdec.edu"
        send_resolved: true
        headers:
          Subject: "[IoT ALERT] Device Status Change"

inhibit_rules:
  # Suppress warning alerts when critical alert is active
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]

  # Suppress duplicate alerts for same instance
  - source_match:
      severity: "critical"
    target_match:
      severity: "critical"
    equal: ["instance"]
