# Alertmanager configuration for CLIRDEC:PRESENCE System
# Handles routing and notification of alerts from Prometheus

global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@presence.clirdec.edu"
  smtp_auth_username: "alerts@presence.clirdec.edu"
  smtp_auth_password: "your-app-password"
  smtp_require_tls: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["alertname", "cluster", "service"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: "team-email"
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: "critical-pager"
      continue: true

    # Database alerts - immediate notification
    - match:
        category: database
      receiver: "database-team"
      continue: true

    # IoT device alerts - immediate notification
    - match:
        category: iot
      receiver: "iot-team"
      continue: true

    # System alerts - immediate notification
    - match:
        category: system
      receiver: "system-team"
      continue: true

    # Business logic alerts - daily summary
    - match:
        category: business
      receiver: "business-daily"
      group_interval: 24h
      repeat_interval: 24h

receivers:
  # Primary team email for general alerts
  - name: "team-email"
    email_configs:
      - to: "team@clirdec.edu"
        subject: "{{ .GroupLabels.alertname }} - {{ .Status | title }}"
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Status: {{ .Status }}
          Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ if .EndsAt }}Ended: {{ .EndsAt.Format "2006-01-02 15:04:05" }}{{ end }}
          {{ end }}

  # Critical alerts - immediate SMS/pager
  - name: "critical-pager"
    pagerduty_configs:
      - service_key: "your-pagerduty-service-key"
        description: "{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}"
        severity: "{{ .Labels.severity }}"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        channel: "#alerts-critical"
        title: "🚨 CRITICAL ALERT: {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"
        color: "danger"

  # Database team notifications
  - name: "database-team"
    email_configs:
      - to: "dba@clirdec.edu"
        subject: "🚨 Database Alert: {{ .GroupLabels.alertname }}"
        body: |
          Database Alert Details:
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
    slack_configs:
      - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        channel: "#database-alerts"
        title: "🗄️ Database Alert: {{ .GroupLabels.alertname }}"
        color: "warning"

  # IoT team notifications
  - name: "iot-team"
    email_configs:
      - to: "iot@clirdec.edu"
        subject: "📡 IoT Alert: {{ .GroupLabels.alertname }}"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        channel: "#iot-alerts"
        title: "📡 IoT Alert: {{ .GroupLabels.alertname }}"
        color: "good"

  # System team notifications
  - name: "system-team"
    email_configs:
      - to: "sysadmin@clirdec.edu"
        subject: "⚙️ System Alert: {{ .GroupLabels.alertname }}"
    slack_configs:
      - api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
        channel: "#system-alerts"
        title: "⚙️ System Alert: {{ .GroupLabels.alertname }}"
        color: "warning"

  # Business logic alerts - daily summary
  - name: "business-daily"
    email_configs:
      - to: "management@clirdec.edu"
        subject: '📊 Daily Business Metrics Summary - {{ .StartsAt.Format "2006-01-02" }}'
        body: |
          Daily Business Metrics Summary:
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

# Inhibition rules to prevent alert spam
inhibit_rules:
  # Don't send database alerts if the entire system is down
  - source_match:
      alertname: ServiceDown
      service: database
    target_match:
      category: database
    equal: ["cluster", "service"]

  # Don't send IoT alerts if network is down
  - source_match:
      alertname: NetworkDown
    target_match:
      category: iot
    equal: ["cluster"]
