# HAProxy Load Balancer Configuration for CLIRDEC:PRESENCE System
# High-performance load balancer with advanced features

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # SSL/TLS settings
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2

    # Performance tuning
    maxconn 10000
    tune.ssl.default-dh-param 2048
    tune.bufsize 32768
    tune.maxrewrite 1024

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    timeout http-keep-alive 10000
    timeout http-request 10000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Frontend for HTTP traffic
frontend http_front
    bind *:8080
    mode http

    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }

# Frontend for HTTPS traffic
frontend https_front
    bind *:8443 ssl crt /etc/ssl/certs/presence.pem
    mode http

    # SSL/TLS settings
    ssl crt /etc/ssl/certs/
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # Rate limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc0_http_req_rate gt 100 }

    # Security headers
    http-response set-header X-Frame-Options SAMEORIGIN
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    # Routing rules
    acl is_api path_beg /api/
    acl is_ws path_beg /ws/
    acl is_static path_beg /static/
    acl is_health path /health

    # Health check endpoint
    use_backend health_backend if is_health

    # WebSocket traffic
    use_backend websocket_backend if is_ws

    # API traffic
    use_backend api_backend if is_api

    # Static files
    use_backend static_backend if is_static

    # Default to web application
    default_backend web_backend

# Backend for API services
backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ api.presence.clirdec.edu
    http-check expect status 200

    # Session persistence for API calls (optional, since sessions are in DB)
    # cookie SERVERID insert indirect nocache
    stick-table type string len 32 size 100k expire 30m
    stick on url_param(sessionId) table api_backend

    # Circuit breaker
    retries 3
    timeout connect 5s
    timeout server 30s

    # Health check
    default-server inter 10s fall 3 rise 2

    # Application servers (horizontal scaling)
    server app-1 presence-app-1:3000 check cookie app1
    server app-2 presence-app-2:3000 check cookie app2
    server app-3 presence-app-3:3000 check cookie app3 backup

# Backend for WebSocket services
backend websocket_backend
    mode http
    balance source  # IP-based session stickiness for WebSocket connections
    option httpchk GET /health HTTP/1.1\r\nHost:\ ws.presence.clirdec.edu
    http-check expect status 200

    # WebSocket upgrade detection
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_websocket hdr(Connection) -i upgrade

    # WebSocket specific timeouts
    timeout connect 5s
    timeout server 86400s  # 24 hours for WebSocket
    timeout tunnel 86400s  # 24 hours for WebSocket

    # Health check
    default-server inter 10s fall 3 rise 2

    # Application servers with WebSocket support
    server app-1 presence-app-1:3000 check
    server app-2 presence-app-2:3000 check
    server app-3 presence-app-3:3000 check backup

# Backend for static files
backend static_backend
    mode http
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ static.presence.clirdec.edu
    http-check expect status 200

    # Static file optimizations
    compression algo gzip
    compression type text/css text/javascript application/javascript application/json

    # Cache settings
    http-response set-header Cache-Control "public, max-age=31536000, immutable" if { path_end .css .js .png .jpg .jpeg .gif .svg .woff .woff2 .ttf .eot }

    # Health check
    default-server inter 10s fall 3 rise 2

    # Application servers (serve static files)
    server app-1 presence-app-1:3000 check
    server app-2 presence-app-2:3000 check
    server app-3 presence-app-3:3000 check backup

# Backend for web application
backend web_backend
    mode http
    balance roundrobin
    option httpchk GET /health HTTP/1.1\r\nHost:\ app.presence.clirdec.edu
    http-check expect status 200

    # Compression
    compression algo gzip
    compression type text/html text/css text/javascript application/javascript

    # Health check
    default-server inter 10s fall 3 rise 2

    # Application servers
    server app-1 presence-app-1:3000 check
    server app-2 presence-app-2:3000 check
    server app-3 presence-app-3:3000 check backup

# Health check backend
backend health_backend
    mode http
    balance roundrobin

    # Simple health response
    http-response set-status 200
    http-response set-header Content-Type "text/plain"
    http-response set-body "OK"

# Statistics interface
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats auth admin:admin123

# Monitoring backend for Prometheus
backend monitoring_backend
    mode http
    balance roundrobin
    option httpchk GET /metrics HTTP/1.1\r\nHost:\ monitoring.presence.clirdec.edu
    http-check expect status 200

    # Health check
    default-server inter 30s fall 3 rise 2

    # Monitoring servers
    server prometheus prometheus:9090 check
    server grafana grafana:3000 check

# CDN integration (if using external CDN)
# This section can be used when integrating with Cloudflare or similar CDN
frontend cdn_front
    bind *:9090
    mode http
    option forwardfor

    # CDN purge endpoint
    acl is_purge method PURGE
    use_backend cdn_purge_backend if is_purge

    # CDN health check
    acl is_health path /cdn-health
    http-response set-status 200 if is_health
    http-response set-header Content-Type "text/plain" if is_health
    http-response set-body "CDN OK" if is_health

backend cdn_purge_backend
    mode http
    balance roundrobin

    # CDN purge logic would go here
    # This is a placeholder for CDN integration
    http-response set-status 200
    http-response set-header Content-Type "application/json"
    http-response set-body '{"status": "purged", "urls": []}'